<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>Flappy Ravi</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main id="gameShell">

    <canvas id="game"></canvas>

    <div id="hud">
      <div id="score">0</div>

      <button id="muteBtn" type="button">
        🔊
      </button>
    </div>

    <!-- START SCREEN -->

    <section id="startScreen" class="overlay">

      <div class="card">

        <div class="eyebrow">
          INC PRESENTS
        </div>

        <h1>
          FLAPPY RAVI
        </h1>

        <p>
          Tap / Click / Press <b>SPACE</b> to fly.
        </p>

        <button id="startBtn" class="primary">
          START GAME
        </button>

      </div>

    </section>


    <!-- GAME OVER -->

    <section id="gameOverScreen" class="overlay hidden">

      <div class="card">

        <div class="eyebrow">
          ARRE BHAI 😭
        </div>

        <h2>
          GAME OVER
        </h2>

        <p>
          Score:
          <b id="finalScore">0</b>
        </p>

        <p>
          Best:
          <b id="bestScore">0</b>
        </p>

        <button id="restartBtn" class="primary">
          PLAY AGAIN
        </button>

      </div>

    </section>


    <div id="tapHint">
      TAP TO FLY
    </div>

  </main>

  <script src="game.js"></script>

</body>
</html>
