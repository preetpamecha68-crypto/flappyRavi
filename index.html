<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Flappy Ravi</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <div class="game-wrapper">

        <div class="title">
            FLAPPY RAVI
        </div>

        <div class="game-container">

            <canvas
                id="gameCanvas"
                width="400"
                height="600"
            ></canvas>

            <div
                id="startScreen"
                class="start-screen"
            >

                <h1>FLAPPY RAVI</h1>

                <p>
                    Don't hit Manoj Tiwari 💀
                </p>

                <button
                    id="startButton"
                    type="button"
                >
                    START GAME
                </button>

                <span>
                    Space / Click to fly
                </span>

            </div>

            <div
                id="gameOverScreen"
                class="game-over-screen hidden"
            >

                <h1>GAME OVER</h1>

                <p>
                    Score:
                    <span id="finalScore">0</span>
                </p>

                <button
                    id="restartButton"
                    type="button"
                >
                    PLAY AGAIN
                </button>

            </div>

        </div>

    </div>

    <script src="game.js"></script>

</body>

</html>
